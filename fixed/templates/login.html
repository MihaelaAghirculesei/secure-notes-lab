{% extends "base.html" %}
{% block title %}Login — SecureNotes Lab{% endblock %}
{% block content %}
<div class="card">
  <h1>Login</h1>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username</label>
    <input type="text" name="username" autocomplete="off">
    <label>Password</label>
    <input type="password" name="password">
    <button type="submit">Log in</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <div class="hint">
    Demo users: <code>alice / alice123</code>, <code>bob / bob123</code><br>
    Try the same SQLi payload used in the vulnerable version: it won't work here.
  </div>
</div>
{% endblock %}
