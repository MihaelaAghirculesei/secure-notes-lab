{% extends "base.html" %}
{% block title %}New note — SecureNotes Lab{% endblock %}
{% block content %}
<div class="card">
  <h1>New note</h1>
  <form method="POST">
    <label>Title</label>
    <input type="text" name="title">
    <label>Content</label>
    <textarea name="content"></textarea>
    <button type="submit">Save</button>
  </form>
  <div class="hint">
    Try writing this in the content field: <code>&lt;script&gt;alert(document.cookie)&lt;/script&gt;</code>
  </div>
</div>
{% endblock %}
